server {
    listen 80;

    # 젠킨스/K8s Ingress에서 /front 경로로 들어오는 것을 감안
    location / {
        root    /usr/share/nginx/html;
        index   index.html index.htm;

        # [핵심] 요청한 파일이 없으면 index.html을 반환해라 (SPA 라우팅 지원)
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root    /usr/share/nginx/html;
    }
}