apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress001
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # 백엔드: /003으로 시작하는 요청
          # 예: /003/hello -> 서비스에는 /hello 로 전달됨
          - path: /003(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tododep001
                port:
                  number: 8000
          # 프론트엔드: /front로 시작하는 요청
          # 예: /front/index.html -> 서비스에는 /index.html 로 전달됨
          - path: /front(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontdep001
                port:
                  number: 80

