apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress001
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # 백엔드 API: /api로 시작하는 요청 (rewrite 없이 그대로 전달)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tododep001
                port:
                  number: 8000
          # 프론트엔드: 나머지 모든 요청
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontdep001
                port:
                  number: 80

