apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress001
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # /003으로 시작하는 요청을 잡아서 뒤의 경로를 서비스로 넘김
          # 예: /003/hello -> 서비스에는 /hello 로 전달됨
          - path: /003(/|$)(.*)       # [제안] 정규식 약간 수정 (필수는 아님)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tododep001
                port:
                  number: 8000

