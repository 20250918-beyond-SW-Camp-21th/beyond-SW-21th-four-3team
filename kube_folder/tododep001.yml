apiVersion: apps/v1
kind: Deployment
metadata:
  name: tododep001
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # 롤링 업데이트 시 최대 1개 추가 Pod 허용
      maxUnavailable: 0    # 무중단 배포: 항상 최소 replicas 유지
  selector:
    matchLabels:
      app: tododep001
  template:
    metadata:
      labels:
        app: tododep001
    spec:
      containers:
        - name: todo-container
          image: o2ppo/todoback002:21
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DB_DRIVER
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: DB_PASSWORD
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: MAIL_USERNAME
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: MAIL_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: JWT_EXPIRATION
            - name: JWT_REFRESH_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: JWT_REFRESH_EXPIRATION
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10      # 스프링 뜰 시간 충분히 부여 (5초 -> 10초)
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080                 # [수정] 정상 작동을 위해 8080으로 변경
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2