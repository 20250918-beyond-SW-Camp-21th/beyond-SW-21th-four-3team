# 이 파일은 참조용 템플릿입니다.
# 실제 Secret은 Jenkins Pipeline에서 생성됩니다.
# Jenkins Credentials에 다음 항목들을 등록해야 합니다:
#   - db-url (Secret text)
#   - db-username (Secret text)
#   - db-password (Secret text)
#   - mail-username (Secret text)
#   - mail-password (Secret text)
#   - jwt-secret (Secret text)

apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
type: Opaque
stringData:
  # DB 설정
  DB_DRIVER: "org.mariadb.jdbc.Driver"
  DB_URL: "${DB_URL}"
  DB_USERNAME: "${DB_USERNAME}"
  DB_PASSWORD: "${DB_PASSWORD}"
  # Mail 설정
  MAIL_USERNAME: "${MAIL_USERNAME}"
  MAIL_PASSWORD: "${MAIL_PASSWORD}"
  # JWT 설정
  JWT_SECRET: "${JWT_SECRET}"
  JWT_EXPIRATION: "1800000"
  JWT_REFRESH_EXPIRATION: "1209600000"
